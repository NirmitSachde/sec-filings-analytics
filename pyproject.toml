[project]
name = "sec-filings-analytics"
version = "0.1.0"
description = "SEC Filings Analytics Platform — ingest, parse, and serve SEC EDGAR data"
requires-python = ">=3.12"
dependencies = [
    "httpx[http2]>=0.27",
    "tenacity>=9.0",
    "selectolax>=0.3",
    "lxml>=5.0",
    "polars>=1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "alembic>=1.13",
    "prefect>=3.0",
    "dbt-core>=1.8",
    "dbt-postgres>=1.8",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sentence-transformers>=3.0",
    "ollama>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
    "types-lxml>=2024.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM", "TCH"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "selectolax.*",
    "prefect.*",
    "dbt.*",
    "sentence_transformers.*",
    "ollama.*",
    "pgvector.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=sec_filings --cov-report=term-missing"

[tool.hatch.build.targets.wheel]
packages = ["src/sec_filings"]
