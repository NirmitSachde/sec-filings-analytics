services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sec_filings
      POSTGRES_PASSWORD: sec_filings_dev
      POSTGRES_DB: sec_filings
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sec_filings"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  metabase:
    image: metabase/metabase:latest
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase_app_db
      MB_DB_PORT: 5432
      MB_DB_USER: sec_filings
      MB_DB_PASS: sec_filings_dev
      MB_DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    command: uvicorn sec_filings.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: sec_filings
      POSTGRES_PASSWORD: sec_filings_dev
      POSTGRES_DB: sec_filings
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: prefect worker start --pool default-agent-pool
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: sec_filings
      POSTGRES_PASSWORD: sec_filings_dev
      POSTGRES_DB: sec_filings
      OLLAMA_HOST: http://ollama:11434
      EDGAR_USER_AGENT: ${EDGAR_USER_AGENT}
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  ollama-data:
