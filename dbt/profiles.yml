sec_filings:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      user: "{{ env_var('POSTGRES_USER', 'sec_filings') }}"
      pass: "{{ env_var('POSTGRES_PASSWORD', 'sec_filings_dev') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'sec_filings') }}"
      schema: public
      threads: 4
