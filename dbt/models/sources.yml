version: 2

sources:
  - name: raw
    description: Raw zone. Append-only, immutable. Loaded by Prefect flows.
    schema: raw
    tables:
      - name: filing_index
        description: One row per accession from the EDGAR full-index files.
        columns:
          - name: accession_number
            tests: [unique, not_null]
      - name: insider_transactions
        description: Parsed Form 4 Table I + Table II rows.
      - name: holdings_positions
        description: Parsed 13F-HR information-table rows.
      - name: daily_prices
        description: |
          Daily OHLC + adjusted close per ticker. Ingested from Stooq's free
          end-of-day CSVs (https://stooq.com/db/). One row per (ticker, date).
          Used for forward-return backtests and benchmark calculations.
        columns:
          - name: ticker
            tests: [not_null]
          - name: date
            tests: [not_null]
          - name: adj_close
            tests: [not_null]
      - name: security_master
        description: |
          Ticker to GICS sector / industry mapping. Built from SEC's
          company_tickers.json plus an enrichment pass against Wikipedia's
          S&P 500 + Russell 1000 constituent tables.
        columns:
          - name: ticker
            tests: [unique, not_null]

  - name: ref
    schema: ref
    tables:
      - name: ticker_cik
        description: Ticker to CIK mapping; refreshed weekly from sec.gov.
